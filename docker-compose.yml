services:
  bot:
    image: ghcr.io/foggghostt/tg-all-bot:latest
    # For local dev: `docker compose up --build` will rebuild from source.
    build: .
    container_name: tg-all-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env or pass it on the command line}
    volumes:
      - bot-data:/data

volumes:
  bot-data:
